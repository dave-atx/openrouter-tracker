name: Update Free Models & Deploy

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6 AM UTC
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest

      - name: Fetch and generate
        run: |
          uv run python src/fetch_models.py
          uv run python src/generate_html.py
          uv run python src/generate_atom.py

      - name: Commit models.json (history)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # models.json is fully regenerated each run, so any local changes
          # are stale by definition. Discard them rather than trying to
          # 3-way merge, which can produce conflicts if a prior run committed
          # in between. (See issue #1.)
          git checkout -- models.json

          git pull --rebase --autostash
          # Verify no conflict markers slipped in (defense in depth).
          if grep -qE '^(<<<<<<<|=======|>>>>>>>) ' models.json; then
            echo "ERROR: conflict markers detected in models.json after pull" >&2
            exit 1
          fi

          if ! git diff --staged --quiet -- models.json; then
            git add models.json
            git commit -m "Update models.json $(date +%F)"
            git push
          else
            echo "No changes to models.json"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4