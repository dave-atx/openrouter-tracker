[project]
name = "openrouter-tracker"
version = "0.1.0"
description = "Track free OpenRouter models with coding rankings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "feedgen>=0.9",
    "python-dateutil>=2.8",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = ["ruff", "pytest", "pytest-asyncio"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio-mode = "auto"